<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Aqours Q water logo</title>
<desc id="desc">Teal letter Q enclosing a water droplet, with flowing wave bands that form the Q tail. Transparent background.</desc>
